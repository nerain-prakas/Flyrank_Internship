services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: research
      POSTGRES_PASSWORD: research
      POSTGRES_DB: research
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./backend/src/database/schema.sql:/docker-entrypoint-initdb.d/001-schema.sql:ro
  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgres://research:research@postgres:5432/research
      LLM_STUB: "1"
      DEV_AUTH_TOKEN: local-development-token
    ports:
      - "3000:3000"
    depends_on:
      - postgres
volumes:
  postgres-data:
